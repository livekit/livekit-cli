name: Notify docs

# Tells livekit/internal-actions that a release went public. It forwards the
# event to livekit/web, which regenerates the CLI reference on docs.livekit.io
# from `lk generate-docs` at this tag and opens a PR.
on:
  release:
    types: [published]

# The dispatch authenticates with SYNC_DISPATCH_TOKEN; GITHUB_TOKEN isn't used.
permissions: {}

jobs:
  dispatch:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to internal actions repo
        env:
          GH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api -X POST repos/livekit/internal-actions/dispatches \
            -f event_type=livekit-cli-released \
            -f client_payload[source_repo]=livekit/livekit-cli \
            -f client_payload[tag]="$TAG"
